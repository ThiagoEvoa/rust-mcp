name: Rust validation

# ---------------------------------------------------------------------------
# AC2 GUARD — this is the MANDATORY, OFFLINE suite.
# [062] / issue #62 / plan.md §11 ("upstream ingestion checks are explicit
# integration jobs rather than mandatory live-network unit tests").
#
# Every unit/integration/doc test in this workflow runs with
# `CARGO_NET_OFFLINE: "true"` over LOCAL loopback fixtures
# (src/ingest/http_fixture.rs::FixtureServer) and temporary directories. This
# suite must NOT gain a live-network dependency: a normal test that reached a
# real upstream would make CI flaky and violate AC2 ("normal unit/integration
# tests do not depend on live upstream availability").
#
# Live upstream ingestion is deliberately a SEPARATE, opt-in job:
# .github/workflows/upstream-ingestion.yml (workflow_dispatch / schedule only,
# never a pull_request/push/merge_group trigger, never a required status, not in
# this workflow's `needs:`). Do not move a live upstream check here and do not
# remove the `CARGO_NET_OFFLINE` guards on the test steps below. See docs/CI.md.
# ---------------------------------------------------------------------------

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Default-logging tests must not inherit a runner's log-level override.
  RUST_LOG: ""

jobs:
  stable:
    name: Rust stable
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install stable Rust with quality tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Record toolchain and configuration
        run: |
          rustup show active-toolchain
          rustc -Vv
          cargo -V
          cargo tree --locked -e features
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Check Clippy warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # AC2: offline by construction — loopback fixtures + CARGO_NET_OFFLINE
      # (see the AC2 guard at the top of this file and docs/CI.md).
      - name: Run unit and integration tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --locked
      - name: Run documentation tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --doc --locked

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the declared minimum Rust version
        run: |
          msrv="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')"
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - name: Record toolchain and configuration
        run: |
          rustup show active-toolchain
          rustc -Vv
          cargo -V
          cargo tree --locked -e features
      - name: Check all targets on MSRV
        run: cargo check --workspace --all-targets --locked
      # AC2: offline by construction — loopback fixtures + CARGO_NET_OFFLINE
      # (see the AC2 guard at the top of this file and docs/CI.md).
      - name: Run unit and integration tests on MSRV
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --locked
      - name: Run documentation tests on MSRV
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --doc --locked

  validation:
    # Keep this name stable: branch rules require this aggregate check.
    name: PR validation
    if: ${{ always() }}
    needs: [stable, msrv]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          STABLE_RESULT: ${{ needs.stable.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          printf 'Rust stable: %s\nRust MSRV: %s\n' "$STABLE_RESULT" "$MSRV_RESULT"
          test "$STABLE_RESULT" = success
          test "$MSRV_RESULT" = success
