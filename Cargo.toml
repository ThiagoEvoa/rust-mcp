# Rust documentation MCP — task [002]: Cargo package bootstrap.
#
# Package metadata and the reproducible toolchain/dependency baseline from
# docs/COMPATIBILITY.md (task [001]). The internal module tree mirrors the
# layout in plan.md section 8 and is filled in by later milestones.

[package]
name = "rust-docs-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local stdio MCP server exposing official Rust documentation to coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThiagoEvoa/rust-mcp"
readme = "README.md"

[[bin]]
name = "rust-docs-mcp"
path = "src/main.rs"

[lib]
name = "rust_docs_mcp"
path = "src/lib.rs"

[dependencies]
# Core, always-needed closure only. docs/COMPATIBILITY.md (task [001]) pins
# rmcp 3.8.0 as the official MCP SDK; the server-side stdio closure is
# `server` (transport-async-rw + schemars) + `macros` (tool/resource derive) +
# `transport-io` (the stdio transport task [005] runs the skeleton on). The
# heavy transport-streamable-http-* / auth features stay off: they are not
# needed for a local stdio MVP. The in-process `client` feature was deliberately
# dropped (PR #77 review): the task [005] lifecycle proof drives the *real*
# `rust-docs-mcp serve` binary over genuine OS stdio with raw JSON-RPC, so no
# in-process SDK client is instantiated, and dropping `client` trims the
# resolved closure by one transitive dep (`tokio-stream`).
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }

# `transport-io` (the MCP stdio transport task [005] runs the skeleton on) is
# *not* in rmcp's default feature set, so we opt in explicitly. It brings
# `tokio` + the async-rw codec closure transitively. The heavy HTTP/SSE/auth
# transports stay off: a local stdio MVP never uses them.

# Corpus/tool payloads (task [007]); schemars builds the MCP JSON schemas
# (task [048]). `serde/derive` mirrors what rmcp's server closure already needs.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "1"
clap = { version = "4.6.7", features = ["derive"] }

# `clap` 4.6 (derive) is the CLI skeleton for task [003]; its MSRV-1.88
# sub-closure resolved cleanly (see Cargo.lock).
#
# Task [004] (typed errors + stderr-only diagnostics) adds the diagnostic/error
# closure, all of which sit well under the 1.88 MSRV floor: `thiserror` 2
# (rust-version 1.77) derives the project's typed error layer, and
# `tracing` + `tracing-subscriber` (both rust-version 1.65) give stderr-only,
# configurable-verbosity diagnostics. `env-filter` is the only tracing-subscriber
# feature needed (RUST_LOG / verbosity). Task [014] (semantic section
# splitting) reused the existing `scraper`-based converter in
# `ingest/html.rs` plus the new `ingest/section.rs` stage, so it added no
# dependency; `reqwest` was added by task [010] (the bounded HTTP fetcher)
# and `scraper` by task [013] (the HTML parse/select layer of the article
# extractor) — both are declared below.
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Tokio async runtime for task [005]: the `serve` command runs the official rmcp
# MCP server over stdio, and the stdio lifecycle test ([005]) spawns that real
# binary over OS stdio. `rmcp` already pulls tokio in *indirectly*, but its
# default feature set does not expose `process` (needed to spawn the binary in
# the spawned-test path) or `#[tokio::test]` macros; declaring tokio directly
# opts those in without altering the pinned rmcp closure. Features kept to the
# runtime/reactor/process surface only -- no network, preserving the plan's
# offline posture. `rmcp`'s async closure is already a tokio runtime, so this
# adds no second async runtime.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "io-std",
    "io-util",
    "sync",
    "process",
] }
# Bounded documentation HTTP fetcher for `sync` ingestion (task [010], issue #10).
# `docs/COMPATIBILITY.md` section 3 pins `reqwest` with `default-features = false`
# so reqwest's own heavy defaults (`default-tls`/native-TLS, `http2`, `charset`,
# `system-proxy`) stay *off*: no system-TLS coupling keeps the build offline-
# friendly and reproducible on the MSRV 1.88 floor (reqwest's own MSRV is 1.85).
# `rustls` gives a dependency-only TLS stack, and `stream` exposes
# `Response::bytes_stream()` so a body can be capped mid-stream instead of being
# buffered whole. `futures-util` (pulled transitively by reqwest's `stream`
# feature; MSRV 1.71) is declared directly only because its `StreamExt::next`
# drives the body-size-cap loop — reqwest does not re-export the trait.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# HTML → Markdown article extractor (task [013], issue #13). `docs/COMPATIBILITY.md`
# section 3 named `scraper` the intended HTML parser for `books.rs` article extraction
# (its `rust-version` is undeclared on the crate, i.e. MSRV UNVERIFIED there) and its
# owner is this task. `scraper` owns the HTML parse/select half of the book/rustfmt/
# clippy article-to-Markdown step; the chosen closure is small, offline, and MSRV-
# friendly: the highest declared `rust-version` in its dependency graph is
# `html5ever`/`cssparser` at 1.85, comfortably below the project's 1.88 floor, and
# `scraper` itself declares no `rust-version`, so neither it nor its closure forces an
# MSRV above 1.88. `default-features = false` drops the `main` (a CLI binary +
# `getopts`) and `errors` features — the library needs only `Html`/`Selector`, so no
# binary or optional error surface is pulled. The Markdown renderer, the callout/
# table/list handling, and the relative-link resolution live in `ingest/html.rs`, not
# in `scraper`; `scraper` is the DOM layer only.
scraper = { version = "0.29.0", default-features = false }
